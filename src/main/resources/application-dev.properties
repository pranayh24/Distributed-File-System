# ======================================================================
# DEV profile — H2 in-memory database. Zero external setup required.
# Run with: mvn spring-boot:run   (dev is the default profile)
# ======================================================================

spring.datasource.url=jdbc:h2:mem:dfs;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Browse the in-memory DB at http://localhost:8080/api/h2-console (JDBC URL above)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
