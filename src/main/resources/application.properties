# ======================================================================
# Common configuration (shared by all profiles)
# Database config lives in application-dev.properties / application-prod.properties
# Default profile is "dev" (H2, zero setup). Set SPRING_PROFILES_ACTIVE=prod to deploy.
# ======================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# Spring Application Configuration
spring.application.name=distributed-file-system
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA Configuration (common)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Disable Spring Shell completely
spring.shell.interactive.enabled=false
spring.autoconfigure.exclude=org.springframework.shell.boot.JLineShellAutoConfiguration,org.springframework.shell.boot.CommandCatalogAutoConfiguration,org.springframework.shell.boot.ApplicationRunnerAutoConfiguration

# File Upload Configuration
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB
spring.servlet.multipart.enabled=true

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# DFS Storage Configuration
dfs.storage.path=${DFS_STORAGE_PATH:./dfs_storage}
dfs.server.host=${DFS_SERVER_HOST:localhost}
dfs.server.port=${DFS_SERVER_PORT:8888}
dfs.replication.factor=${DFS_REPLICATION_FACTOR:3}

# Embedded storage-node cluster (nodes launch in-process with the app)
dfs.cluster.node-count=${DFS_NODE_COUNT:8}
dfs.cluster.base-port=${DFS_BASE_PORT:8091}

# JWT authentication (stateless). MUST set a strong JWT_SECRET (>= 32 chars) in production.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdefghijklmnop}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.org.pr.dfs=DEBUG
logging.level.org.springframework.web=INFO

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
