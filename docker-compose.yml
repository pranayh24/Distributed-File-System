# One-command deploy: Postgres + Spring app (with the embedded 8-node cluster) + Caddy.
# Build and run on the target VM so images match its architecture (OCI A1 = arm64).
#   cp .env.example .env   &&   edit .env   &&   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dfs
      POSTGRES_USER: dfs
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfs -d dfs"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dfs
      SPRING_DATASOURCE_USERNAME: dfs
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx1024m}
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./dfs-frontend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dbdata:
  storage:
  caddy_data:
  caddy_config:
